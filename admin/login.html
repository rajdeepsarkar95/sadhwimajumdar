<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420&family=Space+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<title>Artist Login &middot; Sadhwi Majumder</title>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <p class="lc-mark">Sadhwi Majumder &middot; Studio</p>
    <h1>Artist login</h1>
    <p class="lc-sub">Manage videos, analytics and site content.</p>
    <div class="login-err" id="login-err">Incorrect username or password.</div>
    <form id="login-form" novalidate>
      <div class="f-field">
        <label class="f-label" for="lg-user">Username</label>
        <input class="f-input" id="lg-user" type="text" autocomplete="username" required>
      </div>
      <div class="f-field">
        <label class="f-label" for="lg-pass">Password</label>
        <input class="f-input" id="lg-pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button>
    </form>
    <p class="login-hint"><b>Demo credentials</b>: user <b>sadhwi</b>, password <b>mudra123</b>.<br>In production, verify against a server with hashed passwords and proper sessions.</p>
  </div>
</div>
<script src="js/admin.js"></script>
</body>
</html>
